# Copy outside Git (e.g. ~/.cloudflared/void-dev.yaml).
# Create a Cloudflare Access application and allow policy before running.
# Replace all placeholders with values from your own Cloudflare account.
tunnel: YOUR-TUNNEL-UUID
credentials-file: /absolute/path/outside/git/YOUR-TUNNEL-UUID.json

ingress:
  - hostname: YOUR-CONFIGURED-HOSTNAME
    service: http://127.0.0.1:8080
    originRequest:
      access:
        required: true
        teamName: YOUR-ACCESS-TEAM
        audTag:
          - YOUR-ACCESS-APPLICATION-AUDIENCE
  - service: http_status:404
