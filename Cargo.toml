[package]
name = "voidchats-native"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2.2"
getrandom = { version = "0.3", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "1"
