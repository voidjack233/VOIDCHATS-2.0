[package]
name = "voidchats-native"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
async-trait = "0.1"
slint = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ed25519-dalek = "2.2"
getrandom = { version = "0.3", features = ["std"] }
# Official Signal v0.106.1 (AGPL-3.0-only). A clean build needs protoc on PATH or PROTOC (verified with 34.1).
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", rev = "904c8dc8216073b078a5f2f5090e3da8382e6a92" }
rand = "0.9.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# A clean Windows GNU build of vendored OpenSSL needs MSYS2 Perl and GNU Make on PATH.
rusqlite = { version = "0.42", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
slint-build = "1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
