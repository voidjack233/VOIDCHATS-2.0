[package]
name = "void-openmls"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT"

[lib]
name = "void_openmls"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
openmls = { version = "=0.9.1", default-features = false }
openmls_basic_credential = { version = "=0.6.0", default-features = false }
openmls_rust_crypto = { version = "=0.6.0", default-features = false }
openmls_traits = { version = "=0.6.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
uniffi = "=0.32.2"
zeroize = "=1.9.1"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
